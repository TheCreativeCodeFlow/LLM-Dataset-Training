inference:
  do_sample: true
  max_new_tokens: 15
  stop_sequences:
  - <|end|>
  - <|im_end|>
  - </s>
  temperature: 0.3
  top_k: 50
  top_p: 0.95
model:
  adapter_path: ./models/adapters/dsa_tutor_v1
  base_model: microsoft/Phi-3-mini-4k-instruct
  torch_dtype: bfloat16
server:
  host: 127.0.0.1
  port: 8000
  workers: 1
