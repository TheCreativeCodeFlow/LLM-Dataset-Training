# configs/train_config.yaml
model:
  name: "microsoft/Phi-3-mini-4k-instruct"
  torch_dtype: "bfloat16"
  attn_implementation: "eager" # use 'eager' or 'flash_attention_2' if supported by hardware
  use_cache: false

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_use_double_quant: true
  bnb_4bit_compute_dtype: "bfloat16"

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  bias: "none"
  task_type: "CAUSAL_LM"

training:
  output_dir: "./models/checkpoints"
  final_adapter_dir: "./models/adapters/dsa_tutor_v1"
  num_train_epochs: 3
  per_device_train_batch_size: 2
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 2e-4
  weight_decay: 0.01
  warmup_ratio: 0.03
  lr_scheduler_type: "cosine"
  max_grad_norm: 1.0
  seed: 42
  bf16: true
  fp16: false
  gradient_checkpointing: true
  
  # Strategies
  save_strategy: "steps"
  save_steps: 10
  eval_strategy: "steps"
  eval_steps: 10
  logging_strategy: "steps"
  logging_steps: 2
  
  # Tracking & Resume
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  greater_is_better: false
  report_to: "none"

data:
  train_path: "./data/final/train_v1.jsonl"
  eval_path: "./data/final/validation_v1.jsonl"
  max_seq_length: 512
  min_free_disk_gb: 5.0